name: MangaViewer
options:
  bundleIdPrefix: work.okamyuji
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.0"
  Unrar.swift:
    url: https://github.com/mtgto/Unrar.swift.git
    from: "0.3.0"

targets:
  MangaViewer:
    type: application
    platform: macOS
    sources:
      - path: Sources/MangaViewer
      - path: Resources
    dependencies:
      - package: ZIPFoundation
      - package: Unrar.swift
        product: Unrar
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    postBuildScripts:
      # Declaring the processed Info.plist as input orders this after Xcode writes it, and code
      # signing comes after every phase, so the stamped file is the one that gets signed
      - name: Stamp release version
        script: sh "${SRCROOT}/scripts/stamp-version.sh" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" "${SRCROOT}"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.okamyuji.mangaviewer
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        CODE_SIGN_ENTITLEMENTS: MangaViewer.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_UPCOMING_FEATURE_STRICT_CONCURRENCY: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

  MangaViewerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MangaViewerTests
    dependencies:
      - target: MangaViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.okamyuji.mangaviewer.tests
        GENERATE_INFOPLIST_FILE: true

  MangaViewerUITests-macOS:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/MangaViewerUITests-macOS
    dependencies:
      - target: MangaViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.okamyuji.mangaviewer.uitests.macos
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6"
        TEST_TARGET_NAME: MangaViewer

  MangaViewer-iPad:
    type: application
    platform: iOS
    sources:
      - path: Sources/MangaViewer
      - path: Resources
    dependencies:
      - package: ZIPFoundation
      - package: Unrar.swift
        product: Unrar
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    postBuildScripts:
      # Declaring the processed Info.plist as input orders this after Xcode writes it, and code
      # signing comes after every phase, so the stamped file is the one that gets signed
      - name: Stamp release version
        script: sh "${SRCROOT}/scripts/stamp-version.sh" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" "${SRCROOT}"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      base:
        # Same module name as the macOS app so the shared tests can `@testable import MangaViewer`
        PRODUCT_NAME: MangaViewer
        PRODUCT_MODULE_NAME: MangaViewer
        PRODUCT_BUNDLE_IDENTIFIER: work.okamyuji.mangaviewer
        INFOPLIST_FILE: Info-iPad.plist
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_UPCOMING_FEATURE_STRICT_CONCURRENCY: true
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

  MangaViewerTests-iPad:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MangaViewerTests
    dependencies:
      - target: MangaViewer-iPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.okamyuji.mangaviewer.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MangaViewer.app/MangaViewer
        BUNDLE_LOADER: $(TEST_HOST)

  MangaViewerUITests-iPad:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/MangaViewerUITests
    dependencies:
      - target: MangaViewer-iPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.okamyuji.mangaviewer.uitests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6"
        TEST_TARGET_NAME: MangaViewer-iPad

schemes:
  MangaViewer:
    build:
      targets:
        MangaViewer: all
    test:
      config: Debug
      targets:
        - MangaViewerTests
        - MangaViewerUITests-macOS
  MangaViewer-iPad:
    build:
      targets:
        MangaViewer-iPad: all
    test:
      config: Debug
      targets:
        - MangaViewerTests-iPad
        - MangaViewerUITests-iPad

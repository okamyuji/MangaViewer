name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # rails-ci with security-scan: false (or no rails-ci) does not run bundler-audit
  audit:
    uses: okamyuji/reusable-workflows/.github/workflows/ruby-audit.yml@v1

  # fastlane の ci レーン（xcodegen、swiftlint、swiftformat、xcodebuild test、Release build）を動かす
  fastlane:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      # bundler-cache は gem を作業ツリーの vendor/bundle に入れ、swiftlint と swiftformat が fastlane 同梱の Swift まで検査してしまう
      - run: bundle install
        env:
          BUNDLE_FROZEN: "true"
      - run: brew install xcodegen swiftlint swiftformat
      # Local.xcconfig は手元の署名チームを書く gitignore 対象のファイル。CI では署名しない
      - run: printf 'DEVELOPMENT_TEAM =\n' > Local.xcconfig
      - run: bundle exec fastlane ci

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

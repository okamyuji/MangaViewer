name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # rails-ci with security-scan: false (or no rails-ci) does not run bundler-audit
  audit:
    uses: okamyuji/reusable-workflows/.github/workflows/ruby-audit.yml@v1

  # fastlane の ci レーン（xcodegen、swiftlint、swiftformat、macOS の単体・UI 試験、iPad シミュレータの単体・UI 試験、macOS と iPad の Release build）を動かす
  fastlane:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history and tags, so scripts/stamp-version.sh stamps the release tag and commit count
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      # bundler-cache は gem を作業ツリーの vendor/bundle に入れ、swiftlint と swiftformat が fastlane 同梱の Swift まで検査してしまう
      - run: bundle install
        env:
          BUNDLE_FROZEN: "true"
      - run: brew install xcodegen swiftlint swiftformat
      # Local.xcconfig は手元の署名チームを書く gitignore 対象のファイル。CI では署名しない
      - run: printf 'DEVELOPMENT_TEAM =\n' > Local.xcconfig
      # macOS UI tests drive the app, which needs automation mode without an authentication prompt
      - run: sudo automationmodetool enable-automationmode-without-authentication
      - run: bundle exec fastlane ci
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-tests-xcresult
          path: build/ipad-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  # A release is a push to main whose CI passes: tag it vX.Y.Z from the Conventional Commit types since the last tag
  release:
    # The called workflow checks this too; checking here keeps PR runs from starting a job with write access
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [audit, fastlane, security]
    permissions:
      contents: write
    uses: okamyuji/reusable-workflows/.github/workflows/semver-tag.yml@v1
